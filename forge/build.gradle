plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "yes_steve_model.mixins.json"
        mixinConfig "yes_steve_model_forge.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    include "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    modCompileOnly ":geckolib-forge:1.20.4-4.4.4"
    modCompileOnly ":curios-forge:7.4.2+1.20.4"
    modCompileOnly ":elytraslot-forge:7.0.0+1.20.4"
    modCompileOnly ":firstperson-forge:2.7.3-mc1.20.4"
    modCompileOnly ":carryon-forge:1.20.4-2.1.3.13"
    modCompileOnly ":Jade:1.20.4-forge-13.2.1"
    modCompileOnly ":simplehats-forge:1.20.4-0.3.2"

    forgeRuntimeLibrary "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
    include "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.4.1"))

    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }

    from(project(':common').sourceSets.main.resources)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

// Minecraft 1.20.4 targets Java 17; Forge's bootstrap resolves its module layer against the
// launch JVM, so the run tasks must use a Java 17 toolchain even though Gradle itself runs on 21.
tasks.configureEach {
    if (name == 'runServer' || name == 'runClient' || name == 'runData') {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}
